<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos_sobre_nosotros.css"
    <title>Sobre Nosotros</title>
</head>
<body>
    <h1>Sobre Nosotros</h1>
    <p>Somos un equipo de desarrolladores apasionados por crear software de calidad. Nuestro objetivo es ofrecer soluciones útiles y sencillas para nuestros clientes.</p>

        <h2>Contacto</h2>
    <form action="#" method="post">
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="mensaje">Mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea><br><br>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
